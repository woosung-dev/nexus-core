<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>턴 실행 추적 — A/B 나란히 보기</title>
<style>
:root{--bg:#f4f4f2;--fg:#16181d;--dim:#6b7280;--rule:#dcdcd8;--surface:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#0a0c0f;--fg:#e8e8e6;--dim:#8b8f98;--rule:#22252b;--surface:#111}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
  font-family:ui-sans-serif,system-ui,"Noto Sans KR",sans-serif;font-size:14px}
header{padding:20px 24px;border-bottom:1px solid var(--rule);background:var(--surface)}
h1{margin:0 0 4px;font-size:16px;letter-spacing:-.01em}
p{margin:0;color:var(--dim);font-size:12.5px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--rule);
  height:calc(100dvh - 74px)}
@media(max-width:900px){.grid{grid-template-columns:1fr;height:auto}
  .pane{height:88dvh}}
.pane{display:flex;flex-direction:column;background:var(--surface);min-height:0}
.bar{padding:8px 14px;border-bottom:1px solid var(--rule);font-size:12.5px;
  display:flex;justify-content:space-between;align-items:center;flex:none}
.bar b{font-weight:600}
.bar span{color:var(--dim);font-size:11.5px}
.bar a{color:inherit;font-size:11.5px}
iframe{flex:1;width:100%;border:0;min-height:0}
</style>
</head>
<body>
<header>
  <h1>턴 실행 추적 — A안 / B안</h1>
  <p>같은 실측 trace 1건(봇 29 · 메시지 #180)으로 그렸다. 설계 근거는 <code>_brief.md</code>.</p>
</header>
<div class="grid">
  <div class="pane">
    <div class="bar"><b>A안 진단 콘솔</b><span>카드 · 그리드 · 상태색 · 기존 관리자와 같은 결</span><a href="a-console.html" target="_blank">단독</a></div>
    <iframe src="a-console.html" title="A안 진단 콘솔"></iframe>
  </div>
  <div class="pane">
    <div class="bar"><b>B안 판독지</b><span>상자 없음 · 헤어라인 · mono 숫자 · 읽는 화면</span><a href="b-ledger.html" target="_blank">단독</a></div>
    <iframe src="b-ledger.html" title="B안 판독지"></iframe>
  </div>
</div>
</body>
</html>
