<!DOCTYPE html>
<html lang="ko" data-vp="desktop">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>블레싱 · B안 자리</title>
<meta name="description" content="홈은 목록이 아니라 내 진행 상황이다. 겹과 깊이가 시그니처인 멀티봇 클라이언트 시안 B.">
<!--
  B안 「자리」 · ui-ux-pro-max

  Step 2 (필수) 실행 결과와 그 처리:
    python3 …/scripts/search.py "document knowledge assistant workspace multibot
      trust-first institutional" --design-system -f markdown
    → Pattern: FAQ/Documentation Landing · Style: Exaggerated Minimalism
      Colors: #2563EB accent / Typography: Atkinson Hyperlegible
    이 중 팔레트와 서체는 채택하지 않았다. 브랜드 보라 #603B94 가 고정값이고
    한글 본문에 Atkinson 은 적용되지 않기 때문이다(라틴 전용 서체다).
    채택한 것: 검색을 화면 위쪽에 두는 것, 해결되지 않은 질문의 에스컬레이션 경로,
    카테고리 아이콘을 브랜드색으로 두는 것, 그리고 프리딜리버리 체크리스트 전부.
    보강 검색: --domain ux "elevation shadow depth layering navigation sidebar"
      → 고정 내비게이션은 본문을 가리지 않게 패딩으로 보정할 것(Result 2)
      → 3단계 이상 깊이에서만 breadcrumb(Result 3)
    보강 검색: --domain style "layered depth material elevation tactile"
      → Skeuomorphism 은 기각(성능 Poor, 텍스처가 가독성을 깎는다)
      → Tactile Digital 의 누름 반응(scale .95 + 스프링)만 채택

  명제: 홈은 목록이 아니라 내 진행 상황이다.
    A안이 "말을 여는 자리"라면 B안은 "돌아오는 자리"다. 첫 화면의 본문은
    이어가는 대화, 자주 가는 창구, 그리고 지난번 이후 바뀐 문서다.
    창구는 태그 서가로 묶여 가로로 눕는다. 40곳까지 화면이 흔들리지 않는다.

  시그니처: 겹.
    고도(elevation) 0~4 를 토큰으로 정하고 그 계단으로만 위계를 만든다.
    그림자는 검정이 아니라 잉크 보라를 탄다. 창구 카드를 누르면
    View Transitions 로 그 카드가 대화 헤더로 이어진다.

  인용 UI 는 A안과 다르다. A 는 우측 레일(side panel), B 는 문장 바로 아래에서
  열리는 끼움 카드(nested at block edge)다. 같은 계약을 다른 기전으로 푼다.

  다이얼 대응값: 변화 6 / 모션 6 / 밀도 7
  화면의 봇 이름, 문서명, 규정 내용, 인용문, 계정 정보는 전부 UI 검토용 예시다.

  해시: #home/n40/dark/mobile 처럼 순서 무관 다중 세그먼트.
-->
<script>
  try {
    var t = localStorage.getItem('bc-b-theme');
    if (t) document.documentElement.setAttribute('data-theme', t);
    var m = localStorage.getItem('bc-b-motion');
    if (m) document.documentElement.setAttribute('data-motion', m);
  } catch (e) {}
</script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/fonts-archive/MaruBuri/MaruBuri.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* ══ 토큰 ═════════════════════════════════════════════════════════════════
   A안보다 표면이 차다. 같은 보라를 쓰되 회색을 중립 쪽으로 밀었다.
   고도는 0~4 다섯 계단이고 그 사이 값을 쓰지 않는다.                        */
:root{
  color-scheme:light;
  --motion:1;

  --bg:#EFEFF3;          /* 앱 바깥 바닥. 카드가 이 위에 뜬다 */
  --surface:#FFFFFF; --surface-2:#F6F6F9; --surface-3:#EAEAF0;
  --ink:#221B2E; --ink-2:#57506A; --ink-3:#7B7490;
  --rule:#E1E0E8; --rule-2:#CBC9D6;
  --act:#523A82; --on-act:#FFFFFF; --act-soft:#EDE7F6; --act-line:#B7A4D4;
  --gold:#C9A227; --gold-ink:#6B5000; --gold-soft:#FAF2DA;
  --danger:#A3231B; --danger-soft:#FBEDEB;
  --ok:#256B4B;
  --em-field:#F8C800; --em-mark:#003D84;

  /* 고도 0~4. 그림자는 검정이 아니라 잉크 보라다. 이 한 줄이 화면을 눕힌다. */
  --e0:none;
  --e1:0 1px 2px rgba(34,27,46,.05);
  --e2:0 1px 2px rgba(34,27,46,.05), 0 3px 8px rgba(34,27,46,.06);
  --e3:0 2px 4px rgba(34,27,46,.06), 0 8px 20px rgba(34,27,46,.08);
  --e4:0 4px 8px rgba(34,27,46,.07), 0 18px 44px rgba(34,27,46,.12);
  --bevel:inset 0 1px 0 rgba(255,255,255,.85);

  /* 반경: 셸 18, 카드 12, 입력 10, 작은 것 7, 알약 999 */
  --r-shell:18px; --r-card:12px; --r-field:10px; --r-sm:7px; --r-pill:999px;

  --chrome:#131019; --chrome-2:#1E1A28; --chrome-line:#2E2839;
  --chrome-fg:#A9A1B8; --chrome-fg-2:#EEEAF4;

  --ease:cubic-bezier(.2,.8,.2,1);
  --spring:cubic-bezier(.34,1.4,.64,1);
  --sans:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo",system-ui,sans-serif;
  --serif:"Maru Buri",MaruBuri,"Noto Serif KR",serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E0C13; --surface:#191521; --surface-2:#211C2C; --surface-3:#2A2437;
  --ink:#EDEAF3; --ink-2:#B6AFC6; --ink-3:#8E869F;
  --rule:#2C2637; --rule-2:#3C3450;
  --act:#C3A9E6; --on-act:#191021; --act-soft:#2A2138; --act-line:#6B5490;
  --gold:#D9B84A; --gold-ink:#EBD48A; --gold-soft:#2A2316;
  --danger:#F2A9A2; --danger-soft:#2C1917;
  --ok:#8CD3B0;
  --e1:0 1px 2px rgba(0,0,0,.5);
  --e2:0 1px 2px rgba(0,0,0,.5), 0 3px 8px rgba(0,0,0,.4);
  --e3:0 2px 4px rgba(0,0,0,.5), 0 8px 20px rgba(0,0,0,.44);
  --e4:0 4px 8px rgba(0,0,0,.5), 0 18px 44px rgba(0,0,0,.5);
  --bevel:inset 0 1px 0 rgba(255,255,255,.05);
  --em-field:#E8BE1E; --em-mark:#8FB6E8;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0E0C13; --surface:#191521; --surface-2:#211C2C; --surface-3:#2A2437;
    --ink:#EDEAF3; --ink-2:#B6AFC6; --ink-3:#8E869F;
    --rule:#2C2637; --rule-2:#3C3450;
    --act:#C3A9E6; --on-act:#191021; --act-soft:#2A2138; --act-line:#6B5490;
    --gold:#D9B84A; --gold-ink:#EBD48A; --gold-soft:#2A2316;
    --danger:#F2A9A2; --danger-soft:#2C1917;
    --ok:#8CD3B0;
    --e1:0 1px 2px rgba(0,0,0,.5);
    --e2:0 1px 2px rgba(0,0,0,.5), 0 3px 8px rgba(0,0,0,.4);
    --e3:0 2px 4px rgba(0,0,0,.5), 0 8px 20px rgba(0,0,0,.44);
    --e4:0 4px 8px rgba(0,0,0,.5), 0 18px 44px rgba(0,0,0,.5);
    --bevel:inset 0 1px 0 rgba(255,255,255,.05);
    --em-field:#E8BE1E; --em-mark:#8FB6E8;
  }
}
:root[data-motion="off"]{ --motion:0; }
@media (prefers-reduced-motion:reduce){ :root:not([data-motion="on"]){ --motion:0; } }

*,*::before,*::after{ box-sizing:border-box; }
html,body{ margin:0; padding:0; }
body{
  background:var(--chrome); color:var(--ink);
  font-family:var(--sans); font-size:16px; line-height:1.6;
  -webkit-font-smoothing:antialiased;
  word-break:keep-all; overflow-wrap:break-word; letter-spacing:0;
  display:flex; flex-direction:column; min-height:100dvh;
}
button,input,textarea{ font:inherit; color:inherit; }
button{ background:none; border:none; cursor:pointer; }
:focus-visible{ outline:2.5px solid var(--act); outline-offset:2px; border-radius:4px; }
.sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
.nm2,.nd,.rq,.rw,.tn,.tc,.rb,.rs{ display:block; }
.nt,.rt{ display:block; min-width:0; }
.tcard .rt{ flex:1; }

/* ══ 프로토타입 크롬 - 상단 가로 띠. A안은 좌측 세로 목록이다 ══════════ */
.pc{
  flex:none; z-index:50; background:var(--chrome); color:var(--chrome-fg);
  border-bottom:1px solid var(--chrome-line); padding:9px 16px;
  display:flex; align-items:center; gap:16px; flex-wrap:wrap; font-size:12px;
}
.pc .brand{ font-size:12.5px; color:var(--chrome-fg-2); font-weight:600; letter-spacing:-.01em; white-space:nowrap; }
.pc .brand b{ color:var(--em-field); }
.pc .grp{ display:flex; align-items:center; gap:5px; }
.pc .grp > span{ font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:#6F6584; margin-right:1px; }
.pc button{ padding:3.5px 8px; border-radius:var(--r-sm); background:var(--chrome-2); color:var(--chrome-fg);
  border:1px solid var(--chrome-line); font-size:11.5px; }
.pc button:hover{ background:#2A2338; color:var(--chrome-fg-2); }
.pc button[aria-pressed="true"]{ background:var(--chrome-fg-2); color:var(--chrome); border-color:var(--chrome-fg-2); font-weight:600; }
.pc .hash{ margin-left:auto; font-family:var(--mono); font-size:10px; color:#665C7A; }
.pc .note{ width:100%; font-size:10.5px; color:#6A6080; }

/* 크롬 띠의 높이를 상수로 박지 않는다. 줄바꿈되면 값이 틀어지고 컴포저가 접힌다.
   바깥을 세로 플렉스로 두고 앱이 남은 높이를 그대로 채우게 한다. */
/* 대조판 안에서는 크롬을 감춘다. 해시에 /bare 를 붙이면 켜진다. */
:root[data-bare="on"] .pc{ display:none; }
.stage{ background:var(--chrome); padding:0; display:flex; flex:1; min-height:0; }
.app{
  container-type:inline-size; container-name:app;
  width:100%; background:var(--bg); color:var(--ink);
  display:flex; flex-direction:column; flex:1; min-height:0; overflow:hidden;
}
[data-vp="mobile"] .stage{ padding:20px; justify-content:center; align-items:flex-start; overflow:auto; }
[data-vp="mobile"] .app{ width:390px; flex:none; height:820px;
  border-radius:var(--r-shell); box-shadow:var(--e4); overflow:hidden; }

.screen{ display:none; }
.screen[data-on]{ display:flex; flex:1; min-height:0; }

/* ══ 셸 - 늘 있는 좌측 레일. A안에는 레일이 없다 ═══════════════════════ */
.shell{ display:grid; grid-template-columns:232px minmax(0,1fr); flex:1; min-height:0; width:100%; }
@container app (max-width:899px){ .shell{ grid-template-columns:minmax(0,1fr); } }

.rail{
  background:var(--surface); border-right:1px solid var(--rule);
  display:flex; flex-direction:column; min-height:0; padding:14px 12px;
}
@container app (max-width:899px){ .rail{ display:none; } }
.rail-brand{ display:flex; align-items:center; gap:9px; padding:4px 8px 14px; }
.rail-brand .em{ width:28px; height:28px; flex:none; }
.rail-brand .rb{ font-size:14.5px; font-weight:650; letter-spacing:-.015em; }
.rail-brand .rs{ font-size:10.5px; color:var(--ink-3); }
.rail nav{ display:grid; gap:1px; }
.nav-item{
  display:flex; align-items:center; gap:10px; width:100%; text-align:left;
  padding:8px 10px; border-radius:var(--r-sm); font-size:13.5px; color:var(--ink-2);
  transition:background .15s var(--ease), color .15s var(--ease);
}
.nav-item svg{ width:17px; height:17px; flex:none; color:var(--ink-3); }
.nav-item:hover{ background:var(--surface-2); color:var(--ink); }
.nav-item[aria-current="page"]{ background:var(--act-soft); color:var(--act); font-weight:600; }
.nav-item[aria-current="page"] svg{ color:var(--act); }
.rail-h{ font-size:10px; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-3);
  font-weight:600; padding:16px 10px 6px; }
.rail-scroll{ flex:1; min-height:0; overflow-y:auto; margin:0 -4px; padding:0 4px; }
.rail-foot{ border-top:1px solid var(--rule); padding-top:10px; margin-top:10px; }

/* ══ 본문 ════════════════════════════════════════════════════════════════ */
.main{ display:flex; flex-direction:column; min-width:0; min-height:0; }
/* 고정 상단 바는 본문을 가리지 않는다. 본문 패딩으로 보정한다. */
.topbar{
  position:sticky; top:0; z-index:20; flex:none;
  display:flex; align-items:center; gap:12px; height:58px; padding:0 22px;
  background:color-mix(in srgb, var(--bg) 86%, transparent);
  border-bottom:1px solid var(--rule);
}
@supports not (background:color-mix(in srgb, red 50%, blue)){ .topbar{ background:var(--bg); } }
.topbar .tt{ font-size:14.5px; font-weight:650; letter-spacing:-.015em; }
.topbar .sp{ flex:1; }
.icon-btn{ width:32px; height:32px; border-radius:var(--r-sm); display:grid; place-items:center; color:var(--ink-2);
  transition:background .15s var(--ease); }
.icon-btn:hover{ background:var(--surface-2); }
.avatar{ width:30px; height:30px; border-radius:var(--r-pill); background:var(--act-soft); color:var(--act);
  display:grid; place-items:center; font-size:12px; font-weight:600; border:1px solid var(--act-line); }

.body{ flex:1; min-height:0; overflow-y:auto; }
.wide{ max-width:1080px; padding:26px 22px 60px; }
@container app (max-width:899px){ .wide{ padding:18px 14px 40px; } }

/* ══ 검색 - Step 2 가 권한 것. 화면 위쪽에 둔다 ══════════════════════════ */
.search{
  display:flex; align-items:center; gap:10px; padding:11px 14px; margin-bottom:22px;
  background:var(--surface); border:1px solid var(--rule); border-radius:var(--r-field);
  box-shadow:var(--e1),var(--bevel);
  transition:box-shadow .2s var(--ease), border-color .18s var(--ease);
}
.search:focus-within{ border-color:var(--act); box-shadow:var(--e3),0 0 0 4px var(--act-soft); }
.search svg{ width:17px; height:17px; color:var(--ink-3); flex:none; }
.search input{ flex:1; border:none; outline:none; background:none; font-size:14.5px; min-width:0; }
.search input::placeholder{ color:var(--ink-3); }
.search kbd{ font-family:var(--mono); font-size:10.5px; color:var(--ink-3); padding:2px 6px;
  border:1px solid var(--rule-2); border-radius:5px; }

/* ══ 절 ═══════════════════════════════════════════════════════════════════ */
.sec{ margin-bottom:30px; }
.sec-hd{ display:flex; align-items:baseline; gap:10px; margin-bottom:11px; }
.sec-hd h2{ margin:0; font-size:14px; font-weight:650; letter-spacing:-.01em; }
.sec-hd .c{ font-family:var(--mono); font-size:11px; color:var(--ink-3); }
.sec-hd .sp{ flex:1; }
.sec-hd a,.sec-hd button.more{ font-size:12.5px; color:var(--ink-3); }
.sec-hd button.more:hover{ color:var(--act); }

/* 이어가는 대화 - 고도 2. 이 화면에서 가장 위에 뜬 것 */
.threads{ display:grid; gap:9px; }
.tcard{
  display:flex; align-items:center; gap:13px; width:100%; text-align:left;
  padding:13px 15px; border-radius:var(--r-card); background:var(--surface);
  border:1px solid var(--rule); box-shadow:var(--e2),var(--bevel);
  transition:box-shadow .22s var(--ease), transform .22s var(--spring);
}
.tcard:hover{ box-shadow:var(--e3); transform:translateY(-2px); }
.tcard:active{ transform:translateY(0) scale(.995); box-shadow:var(--e1); }
.mark{
  width:36px; height:36px; flex:none; border-radius:10px; display:grid; place-items:center;
  background:var(--act-soft); color:var(--act); border:1px solid var(--act-line);
}
.mark svg{ width:19px; height:19px; }
.mark.sm{ width:28px; height:28px; border-radius:8px; }
.mark.sm svg{ width:15px; height:15px; }
.tcard .rq{ font-size:14px; font-weight:550; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.tcard .rw{ font-size:11.5px; color:var(--ink-3); margin-top:1px; }
.tcard .when{ font-family:var(--mono); font-size:10.5px; color:var(--ink-3); flex:none; }

/* 바뀐 문서 - 고도 1. 알림이지 작업이 아니다 */
.changes{ display:grid; gap:1px; background:var(--rule); border:1px solid var(--rule);
  border-radius:var(--r-card); overflow:hidden; box-shadow:var(--e1); }
.chg{ display:flex; align-items:center; gap:11px; padding:11px 14px; background:var(--surface); font-size:13.5px; }
.chg svg{ width:16px; height:16px; color:var(--ink-3); flex:none; }
.chg .cn{ flex:1; min-width:0; }
.chg .cd{ font-family:var(--mono); font-size:10.5px; color:var(--ink-3); flex:none; }

/* ══ 서가 - 가로 스냅. 40곳에서도 세로가 안 늘어난다 ════════════════════ */
.shelf{ margin-bottom:22px; }
.shelf-hd{ display:flex; align-items:baseline; gap:9px; margin-bottom:9px; }
.shelf-hd .sn{ font-size:13.5px; font-weight:600; }
.shelf-hd .sd{ font-size:11.5px; color:var(--ink-3); }
.shelf-hd .sc{ font-family:var(--mono); font-size:10.5px; color:var(--ink-3); margin-left:auto; }
.track{
  display:grid; grid-auto-flow:column; grid-auto-columns:236px; gap:10px;
  overflow-x:auto; scroll-snap-type:x mandatory; padding:3px 3px 10px;
  scrollbar-width:thin;
}
.track::-webkit-scrollbar{ height:7px; }
.track::-webkit-scrollbar-thumb{ background:var(--rule-2); border-radius:var(--r-pill); }
.wcard{
  scroll-snap-align:start; text-align:left; padding:14px; border-radius:var(--r-card);
  background:var(--surface); border:1px solid var(--rule); box-shadow:var(--e1),var(--bevel);
  display:flex; flex-direction:column; gap:8px; min-height:132px;
  transition:box-shadow .22s var(--ease), transform .22s var(--spring), border-color .18s var(--ease);
}
.wcard:hover{ box-shadow:var(--e3); transform:translateY(-3px); border-color:var(--rule-2); }
.wcard:active{ transform:translateY(-1px) scale(.985); }
.wcard .nm2{ font-size:14px; font-weight:600; letter-spacing:-.01em; }
.wcard .nd{ font-size:12px; color:var(--ink-3); line-height:1.5; }
.wcard .foot{ margin-top:auto; display:flex; flex-direction:column; align-items:flex-start; gap:6px;
  padding-top:9px; border-top:1px solid var(--rule); }
.wcard .dc{ font-family:var(--mono); font-size:10.5px; color:var(--ink-3); }

/* 능력 표기 - 기대와 어긋나는 쪽만 적는다 */
.caps{ display:flex; flex-wrap:wrap; gap:4px; }
.cap{ display:inline-flex; align-items:center; gap:4px; font-size:10.5px; line-height:1.5;
  padding:2px 7px; border-radius:5px; background:var(--surface-2); color:var(--ink-2); border:1px solid var(--rule); }
.cap svg{ width:11px; height:11px; }
.cap.off{ color:var(--ink-3); border-style:dashed; background:transparent; }

/* 유형 라벨 - 등급이 아니라 종류다. 전부 같은 색 */
.kind{ display:inline-flex; align-items:center; font-size:10.5px; font-weight:600;
  padding:1.5px 7px; border-radius:5px; background:var(--surface-3); color:var(--ink-2);
  border:1px solid var(--rule-2); white-space:nowrap; }
.kind.flag{ background:transparent; color:var(--ink-3); border-style:dashed; }

/* ══ 대화 ═════════════════════════════════════════════════════════════════ */
.conv{ display:flex; flex-direction:column; flex:1; min-height:0; }
.conv-hd{
  position:sticky; top:0; z-index:20; flex:none;
  display:flex; align-items:center; gap:12px; padding:11px 22px;
  background:var(--surface); border-bottom:1px solid var(--rule); box-shadow:var(--e1);
}
.conv-hd .tn{ font-size:14px; font-weight:650; }
.conv-hd .tc{ font-size:11px; color:var(--ink-3); }
.conv-body{ flex:1; min-height:0; overflow-y:auto; }
.conv-in{ max-width:760px; margin:0 auto; padding:26px 22px 30px; }
@container app (max-width:899px){ .conv-in{ padding:18px 14px 22px; } .conv-hd{ padding:10px 14px; } }

.ask{ display:flex; justify-content:flex-end; margin-bottom:22px; }
.ask .b{ max-width:78%; padding:10px 15px; border-radius:14px 14px 3px 14px;
  background:var(--act); color:var(--on-act); font-size:14.5px; line-height:1.55; box-shadow:var(--e2); }

/* 답변은 전폭 문서다. 말풍선을 씌우지 않는다. */
.reply{ font-size:15.5px; line-height:1.72; }
.reply .lead{ font-size:16.5px; line-height:1.6; font-weight:550; letter-spacing:-.012em; margin:0 0 18px; }
.part{ margin:0 0 18px; }
.part > .pl{ font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3); font-weight:600; margin:0 0 6px; }
.part p{ margin:0 0 8px; }
.part p:last-child{ margin:0; }
.steps{ list-style:none; margin:0; padding:0; display:grid; gap:10px; counter-reset:s; }
.steps li{ display:grid; grid-template-columns:24px 1fr; gap:11px; align-items:start; counter-increment:s; }
.steps li::before{ content:counter(s,decimal-leading-zero); font-family:var(--mono); font-size:11px;
  color:var(--ink-3); padding-top:5px; }

/* ══ 인용 - 문장 바로 아래에서 열리는 끼움 카드. A안의 우측 레일과 다르다 ══
   호버가 없는 모바일에서도 그대로 동작한다.                                 */
.cnb{ white-space:nowrap; }
.cite{
  display:inline-flex; align-items:center; gap:4px; vertical-align:middle; position:relative; top:-1px;
  padding:1px 7px 1px 5px; border-radius:5px; font-size:11.5px; line-height:1.6; font-weight:550;
  background:var(--surface-2); color:var(--ink-2); border:1px solid var(--rule-2);
  max-width:19ch; overflow:hidden;
  transition:background .15s var(--ease), border-color .15s var(--ease), color .15s var(--ease);
}
.cite svg{ width:12px; height:12px; flex:none; color:var(--ink-3); }
.cite .ct{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.cite:hover{ background:var(--act-soft); border-color:var(--act-line); color:var(--act); }
.cite[aria-expanded="true"]{ background:var(--act-soft); border-color:var(--act); color:var(--act); }
.cite[aria-expanded="true"] svg{ color:var(--act); }

/* 보라는 AI 메시지 뒤에 깔리는 틴트로 쓰지 않는다. 두 곳을 잇는 납작한 선으로만 쓴다. */
.seg{ box-shadow:inset 0 -1.5px 0 transparent; box-decoration-break:clone;
  -webkit-box-decoration-break:clone; transition:box-shadow .26s var(--ease); }
.seg.lit{ box-shadow:inset 0 -1.5px 0 var(--act); }

.slot{ display:grid; grid-template-rows:0fr; transition:grid-template-rows .32s var(--ease); }
.slot.open{ grid-template-rows:1fr; }
.slot > .inner{ overflow:hidden; min-height:0; }
.src{
  margin:11px 0 3px; padding:13px 15px; border-radius:var(--r-card);
  background:var(--surface); border:1px solid var(--act-line); box-shadow:var(--e3);
}
.src .st{ font-size:13.5px; font-weight:600; margin-bottom:3px; }
.src .sm{ display:flex; align-items:center; gap:7px; flex-wrap:wrap; margin-bottom:9px; }
.quote{ font-family:var(--serif); font-size:13.5px; line-height:1.78; color:var(--ink-2);
  padding-left:12px; border-left:1px solid var(--rule-2); }
.quote mark{ background:none; color:inherit; box-shadow:inset 0 -.52em 0 var(--gold-soft);
  border-bottom:1.5px solid var(--gold); padding-bottom:1px; }

/* ══ 검색 타임라인 → 영수증 ══════════════════════════════════════════════ */
.trace{ margin:0 0 18px; }
.trace-live{ display:grid; gap:6px; padding:11px 13px; border-radius:var(--r-card);
  background:var(--surface-2); }
.trace-step{ display:flex; align-items:center; gap:9px; font-size:12.5px; color:var(--ink-3); }
.trace-step .dot{ width:6px; height:6px; border-radius:var(--r-pill); background:var(--rule-2); flex:none; }
.trace-step.done .dot{ background:var(--act); }
.trace-step.done{ color:var(--ink-2); }
.trace-step .el{ font-family:var(--mono); font-size:10.5px; margin-left:auto; }
.receipt{ display:inline-flex; align-items:center; gap:8px; padding:5px 12px 5px 10px;
  border-radius:var(--r-pill); border:1px solid var(--rule); background:var(--surface);
  font-size:12px; color:var(--ink-2); box-shadow:var(--e1);
  transition:box-shadow .18s var(--ease), transform .18s var(--spring); }
.receipt:hover{ box-shadow:var(--e2); transform:translateY(-1px); }
.receipt svg{ width:14px; height:14px; color:var(--ink-3); }
.receipt .rn{ font-family:var(--mono); font-size:11px; }

.notcited{ font-size:12px; color:var(--ink-3); margin-top:14px; }
.notcited summary{ cursor:pointer; list-style:none; display:flex; align-items:center; gap:6px; }
.notcited summary::-webkit-details-marker{ display:none; }
.notcited summary:hover{ color:var(--ink-2); }
.notcited ul{ margin:8px 0 0; padding:0 0 0 17px; display:grid; gap:4px; }

/* ══ 유형별 ═══════════════════════════════════════════════════════════════ */
.chips{ display:flex; flex-wrap:wrap; gap:7px; }
.chip{ padding:7px 13px; border-radius:var(--r-pill); border:1px solid var(--rule-2);
  background:var(--surface); font-size:13px; color:var(--ink-2); box-shadow:var(--e1);
  transition:box-shadow .18s var(--ease), transform .18s var(--spring), color .15s var(--ease); }
.chip:hover{ color:var(--act); box-shadow:var(--e2); transform:translateY(-1px); }
.chip:active{ transform:translateY(0) scale(.97); }

.adults{ list-style:none; margin:0; padding:0; display:grid; gap:1px;
  background:var(--rule); border:1px solid var(--rule); border-radius:var(--r-card); overflow:hidden; }
.adults li{ display:flex; align-items:center; gap:11px; padding:11px 14px; background:var(--surface); font-size:14px; }
.adults .ord{ font-family:var(--mono); font-size:11px; color:var(--ink-3); width:15px; flex:none; }

/* 안전 카드 - 서비스의 목소리다. 상담자의 말풍선이 아니다. 고도 4 로 띄운다. */
.crisis{ margin:16px 0 0; border-radius:var(--r-card); border:1px solid var(--danger);
  background:var(--danger-soft); padding:15px 17px; box-shadow:var(--e4); }
.crisis .ch{ display:flex; align-items:center; gap:8px; margin-bottom:4px; }
.crisis .ch svg{ width:17px; height:17px; color:var(--danger); }
.crisis .ct2{ font-size:13.5px; font-weight:650; color:var(--danger); }
.crisis .sys{ margin-left:auto; font-size:10px; letter-spacing:.06em; text-transform:uppercase;
  color:var(--danger); opacity:.72; font-weight:600; }
.crisis p{ margin:0 0 11px; font-size:13.5px; line-height:1.62; color:var(--ink); }
.lines{ display:grid; gap:7px; }
.line{ display:flex; align-items:center; gap:12px; padding:11px 13px; border-radius:9px;
  background:var(--surface); border:1px solid var(--rule); box-shadow:var(--e1); }
.line .ln{ font-family:var(--mono); font-size:16px; font-weight:500; }
.line .lt{ flex:1; min-width:0; }
.line .lname{ font-size:13.5px; font-weight:600; display:block; }
.line .lmeta{ font-size:11.5px; color:var(--ink-3); display:block; }
.line .badge{ font-size:10.5px; padding:2px 7px; border-radius:var(--r-pill);
  background:var(--surface-2); color:var(--ink-2); border:1px solid var(--rule-2); flex:none; }

/* 이관 */
.handoff{ margin:16px 0 0; border-radius:var(--r-card); border:1px solid var(--rule-2);
  background:var(--surface); padding:16px 17px; box-shadow:var(--e3); }
.handoff .hh{ display:flex; align-items:center; gap:9px; margin-bottom:11px; }
.handoff .hh svg{ width:18px; height:18px; color:var(--act); }
.handoff .hh b{ font-size:13.5px; }
.handoff .target{ display:flex; align-items:center; gap:12px; padding:12px 13px; border-radius:9px;
  background:var(--surface-2); margin-bottom:11px; }
.handoff p{ margin:0 0 11px; font-size:13.5px; line-height:1.62; color:var(--ink-2); }
.handoff .carry{ font-size:12.5px; color:var(--ink-3); padding-top:10px; border-top:1px solid var(--rule); margin:0; }
.btnrow{ display:flex; gap:8px; flex-wrap:wrap; }
.btn{ padding:9px 15px; border-radius:var(--r-sm); font-size:13.5px; font-weight:550;
  background:var(--act); color:var(--on-act); box-shadow:var(--e2);
  transition:transform .18s var(--spring), box-shadow .18s var(--ease); }
.btn:hover{ box-shadow:var(--e3); }
.btn:active{ transform:scale(.97); box-shadow:var(--e1); }
.btn.ghost{ background:var(--surface); color:var(--ink-2); border:1px solid var(--rule-2); box-shadow:var(--e1); }
.btn.ghost:hover{ color:var(--act); border-color:var(--act-line); }

.effort{ margin:0 0 16px; padding:12px 14px; border-radius:var(--r-card);
  background:var(--surface-2); font-size:13px; color:var(--ink-2); }

.fups{ margin-top:24px; padding-top:16px; border-top:1px solid var(--rule); }
.fups .fl{ font-size:12px; color:var(--ink-3); margin-bottom:9px; }
.actbar{ display:flex; align-items:center; gap:4px; margin-top:18px; padding-top:13px; border-top:1px solid var(--rule); }
.actbar button{ padding:6px 11px; border-radius:var(--r-sm); font-size:12.5px; color:var(--ink-3); }
.actbar button:hover{ background:var(--surface-2); color:var(--ink-2); }
.actbar .sp{ flex:1; }

/* 컴포저 - 고정 하단. 본문은 위 패딩으로 보정된다 */
.foot{ flex:none; border-top:1px solid var(--rule); background:var(--surface); padding:11px 22px 13px; }
.foot-in{ max-width:760px; margin:0 auto; }
.helpbar{ display:flex; align-items:center; gap:7px; flex-wrap:wrap; margin-bottom:8px; }
.helpbar .lbl{ font-size:11.5px; color:var(--ink-3); }
.help-chip{ display:inline-flex; align-items:center; gap:5px; padding:4.5px 10px; border-radius:var(--r-pill);
  border:1px solid var(--rule-2); background:var(--surface); font-size:12px; color:var(--ink-2);
  transition:color .15s var(--ease), border-color .15s var(--ease), transform .15s var(--spring); }
.help-chip:hover{ color:var(--act); border-color:var(--act-line); }
.help-chip:active{ transform:scale(.97); }
.help-chip svg{ width:13px; height:13px; }
.composer{ display:flex; align-items:flex-end; gap:8px; background:var(--surface);
  border:1.5px solid var(--rule-2); border-radius:var(--r-field); padding:10px 10px 10px 14px;
  box-shadow:var(--e2),var(--bevel);
  transition:border-color .18s var(--ease), box-shadow .2s var(--ease); }
.composer:focus-within{ border-color:var(--act); box-shadow:var(--e3),0 0 0 4px var(--act-soft); }
.composer textarea{ flex:1; border:none; background:none; resize:none; outline:none;
  font-size:15.5px; line-height:1.55; min-height:24px; max-height:140px; padding:0; }
.composer textarea::placeholder{ color:var(--ink-3); }
.send{ width:34px; height:34px; flex:none; border-radius:var(--r-sm); background:var(--act);
  color:var(--on-act); display:grid; place-items:center;
  transition:transform .16s var(--spring), background .16s var(--ease); }
.send:active{ transform:scale(.92); }
.disc{ font-size:11.5px; color:var(--ink-3); margin:7px 0 0; }

/* ══ 로그인 ═══════════════════════════════════════════════════════════════ */
.login{ flex:1; display:grid; place-items:center; padding:36px 22px; width:100%; }
.login .panel{
  width:100%; max-width:400px; background:var(--surface); border:1px solid var(--rule);
  border-radius:var(--r-shell); padding:34px 30px 28px; box-shadow:var(--e4),var(--bevel); text-align:center;
}
.login .em{ width:60px; height:60px; margin:0 auto 18px; display:block; }
.login h1{ font-size:21px; line-height:1.35; letter-spacing:-.025em; margin:0 0 8px; font-weight:700; }
.login .sub{ font-size:13.5px; color:var(--ink-2); margin:0 0 24px; }
.sso{ width:100%; display:flex; align-items:center; justify-content:center; gap:9px;
  padding:13px 18px; border-radius:var(--r-field); background:var(--act); color:var(--on-act);
  font-size:14.5px; font-weight:600; box-shadow:var(--e2);
  transition:transform .16s var(--spring), box-shadow .18s var(--ease); }
.sso:hover{ box-shadow:var(--e3); }
.sso:active{ transform:scale(.985); }
.login .fine{ font-size:11.5px; color:var(--ink-3); margin:14px 0 0; line-height:1.6; }
/* 로그인에는 레일이 없다. 카드 한 장이 바닥 위에 떠 있는 것이 이 안의 첫인상이다. */
.login .stack{ position:relative; }
.login .stack::before,.login .stack::after{
  content:""; position:absolute; left:50%; translate:-50% 0; border-radius:var(--r-shell);
  background:var(--surface); border:1px solid var(--rule); pointer-events:none;
}
.login .stack::before{ width:calc(100% - 26px); height:100%; top:11px; opacity:.6; box-shadow:var(--e1); }
.login .stack::after{ width:calc(100% - 52px); height:100%; top:21px; opacity:.32; }
.login .panel{ position:relative; z-index:1; }

/* ══ 창구 상세 · 내 정보 · 읽는 법 · 상태 ════════════════════════════════ */
.head-row{ display:flex; align-items:flex-start; gap:15px; margin-bottom:20px; }
.head-row .mark{ width:52px; height:52px; border-radius:15px; }
.head-row .mark svg{ width:27px; height:27px; }
.h1{ font-size:23px; letter-spacing:-.028em; font-weight:700; margin:0 0 5px; line-height:1.3; }
.lede{ font-size:14px; color:var(--ink-2); margin:0 0 18px; max-width:58ch; }
.dl{ display:grid; grid-template-columns:auto 1fr; gap:7px 18px; font-size:13.5px; margin:0 0 20px; }
.dl dt{ color:var(--ink-3); font-size:12.5px; }
.dl dd{ margin:0; }
.doclist{ display:grid; gap:1px; background:var(--rule); border:1px solid var(--rule);
  border-radius:var(--r-card); overflow:hidden; box-shadow:var(--e1); }
.doclist li{ list-style:none; display:flex; align-items:center; gap:10px; padding:11px 14px;
  background:var(--surface); font-size:13.5px; }
.doclist li svg{ width:15px; height:15px; color:var(--ink-3); flex:none; }
.notdo{ margin-top:20px; padding:15px 16px; border-radius:var(--r-card); background:var(--surface-2); }
.notdo b{ display:block; font-size:13.5px; margin-bottom:6px; }
.notdo p{ margin:0; font-size:13px; color:var(--ink-2); line-height:1.6; }
.tiles{ display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:10px; }
.tile{ padding:15px 16px; border-radius:var(--r-card); border:1px solid var(--rule);
  background:var(--surface); box-shadow:var(--e1),var(--bevel); }
.tile .tn2{ font-family:var(--mono); font-size:21px; letter-spacing:-.02em; }
.tile .tl2{ font-size:12px; color:var(--ink-3); margin-top:2px; }
.state-item{ border:1px solid var(--rule); border-radius:var(--r-card); background:var(--surface);
  overflow:hidden; box-shadow:var(--e1); margin-bottom:12px; }
.state-item h3{ margin:0; padding:12px 15px; font-size:13.5px; border-bottom:1px solid var(--rule);
  background:var(--surface-2); }
.state-item .sb{ padding:15px; font-size:13.5px; color:var(--ink-2); line-height:1.62; }
.empty{ padding:30px 22px; text-align:center; border-radius:var(--r-card);
  border:1px dashed var(--rule-2); background:var(--surface-2); }
.empty b{ display:block; font-size:14.5px; margin-bottom:6px; }
.empty p{ margin:0 auto; font-size:13px; color:var(--ink-2); max-width:40ch; }

/* ══ 모션 ═════════════════════════════════════════════════════════════════
   모든 애니메이션은 위계·서사·피드백·상태전환 중 하나를 한다.
   B안의 안무는 "겹이 뜬다"이다. 카드가 바닥에서 고도를 얻으며 올라온다.     */
@keyframes lift{ from{ opacity:0; transform:translateY(9px) scale(.994); } to{ opacity:1; transform:none; } }
@keyframes slideL{ from{ opacity:0; transform:translateX(-8px); } to{ opacity:1; transform:none; } }
@keyframes pulse{ 0%,100%{ opacity:.35; } 50%{ opacity:1; } }

.screen[data-on] .wide > *, .screen[data-on] .login .stack{
  animation:lift calc(.42s * var(--motion)) var(--ease) both;
  animation-delay:calc(var(--i,0) * .05s * var(--motion));
}
.screen[data-on] .rail nav .nav-item{
  animation:slideL calc(.34s * var(--motion)) var(--ease) both;
  animation-delay:calc(var(--i,0) * .03s * var(--motion));
}
.reply > *{
  animation:lift calc(.46s * var(--motion)) var(--ease) both;
  animation-delay:calc(.05s + var(--i,0) * .09s * var(--motion));
}
.track > .wcard{
  animation:lift calc(.4s * var(--motion)) var(--ease) both;
  animation-delay:calc(var(--i,0) * .045s * var(--motion));
}
.trace-step .dot.live{ animation:pulse calc(1.3s * var(--motion)) ease-in-out infinite; }
:root[data-motion="off"] .trace-step .dot.live{ animation:none; opacity:1; }

:root[data-motion="off"] *,
:root[data-motion="off"] *::before{ animation-duration:.001s !important; animation-delay:0s !important; }
@media (prefers-reduced-motion:reduce){
  :root:not([data-motion="on"]) *,
  :root:not([data-motion="on"]) *::before{ animation-duration:.001s !important;
    animation-delay:0s !important; transition-duration:.001s !important; }
}
/* 창구 카드에서 대화 헤더로 이어지는 전환. 어디서 왔는지를 몸이 안다. */
::view-transition-old(mark),::view-transition-new(mark){ animation-duration:calc(.34s * var(--motion)); }
</style>
</head>
<body>

<!-- 프로토타입 크롬. 상단 가로 띠. -->
<nav class="pc" aria-label="시안 조종">
  <span class="brand"><b>B</b> 자리</span>
  <span class="grp"><span>화면</span><span class="set" id="c-screen"></span></span>
  <span class="grp"><span>답변</span><span class="set" id="c-type"></span></span>
  <span class="grp"><span>창구</span><span class="set" id="c-scale"></span></span>
  <span class="grp"><span>폭</span><span class="set" id="c-vp"></span></span>
  <span class="grp"><span>테마</span><span class="set" id="c-theme"></span></span>
  <span class="grp"><span>모션</span><span class="set" id="c-motion"></span></span>
  <span class="hash" id="c-hash">#home</span>
  <span class="note">예시 데이터입니다. 실제 규정이나 승인 문서가 아닙니다.</span>
</nav>

<div class="stage">
<div class="app" id="app">

  <!-- ══ 로그인 ══════════════════════════════════════════════════════════ -->
  <section class="screen" id="s-login" aria-label="로그인">
    <div class="login">
      <div class="stack">
        <div class="panel">
          <svg class="em" aria-hidden="true"><use href="#em"/></svg>
          <h1>승인된 문서에서<br>답을 찾아 드립니다</h1>
          <p class="sub">하나로 계정으로 시작하세요.</p>
          <button class="sso" data-go="home">
            <svg width="18" height="18" aria-hidden="true"><use href="#i-window"/></svg>

function esc(s){ return String(s).replace(/[&<>"]/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

function visibleBots(){
  if (S.scale === 0) return [];
  if (S.scale <= 14) return BOTS.slice(0, S.scale);
  var out = BOTS.slice();
  for (var i = 0; out.length < S.scale; i++){
    var base = BOTS[i % BOTS.length];
    out.push({ id:1000+i, n:base.n + ' · ' + SUFFIX[i % SUFFIX.length], t:base.t, docs:base.docs,
      mem:base.mem, strict:base.strict, rag:base.rag, plan:base.plan, active:base.active,
      up:base.up, g:base.g, derived:true });
  }
  return out.slice(0, S.scale);
}
function botById(id){
  var all = visibleBots();
  for (var i=0;i<all.length;i++) if (all[i].id === id) return all[i];
  return all[0] || BOTS[0];
}
function capsOf(b){
  var out = [];
  if (!b.active) out.push({ i:'i-none', t:'지금은 답하지 않습니다', off:true });
  if (!b.rag)    out.push({ i:'i-none', t:'문서를 근거로 답하지 않습니다', off:true });
  if (b.strict)  out.push({ i:'i-doc',  t:'근거를 못 찾으면 답하지 않습니다' });
  if (!b.mem)    out.push({ i:'i-checking', t:'앞 대화를 기억하지 않습니다' });
  return out;
}
function capsHtml(b, short){
  var c = capsOf(b);
  if (!c.length) return '';
  return '<div class="caps">' + c.map(function(x){
    var t = short ? x.t.replace('니다','').replace('지 않','지 않음').replace('습','') : x.t;
    return '<span class="cap' + (x.off ? ' off' : '') + '"><svg aria-hidden="true"><use href="#' + x.i + '"/></svg>' + esc(t) + '</span>';
  }).join('') + '</div>';
}
function markOf(b){
  if (!b.active) return 'i-none';
  if (!b.rag)    return 'i-adult';
  if (b.docs && b.docs.length >= 5) return 'i-edition';
  if (b.docs && b.docs.length === 1) return 'i-evidence';
  return 'i-window';
}

    h += '<button class="nav-item" data-go="' + x[0] + '" style="--i:' + i + '"'

      + '<svg aria-hidden="true"><use href="#' + x[1] + '"/></svg>' + esc(x[2]) + '</button>';

      h += '<button class="nav-item" data-bot="' + b.id + '" style="--i:' + (i+3) + '">'

    + '<svg aria-hidden="true"><use href="#i-adult"/></svg>오찬수</button></div>';
  return h;
}

function citePill(c){
  return '<span class="cnb">&nbsp;<button class="cite" data-cite="' + c.n + '" aria-expanded="false">'
    + '<svg aria-hidden="true"><use href="#i-doc"/></svg>'
    + '<span class="ct">' + esc(c.short) + '</span></button></span>';
}
function withCites(html, cites){
  return String(html).replace(/@(\d)/g, function(m, n){
    for (var i=0;i<cites.length;i++) if (cites[i].n === n) return citePill(cites[i]);
    return '';
  });
}
function hl(text, ev){
  if (!ev) return esc(text);
  var at = text.indexOf(ev);
  if (at < 0) return esc(text);
  return esc(text.slice(0, at)) + '<mark>' + esc(ev) + '</mark>' + esc(text.slice(at + ev.length));
}
function srcCard(c){
  return '<div class="slot" data-slot="' + c.n + '"><div class="inner"><article class="src">'
    + '<div class="st">' + esc(c.title) + '</div>'
    + '<div class="sm"><span class="kind">' + esc(c.kind) + '</span>'
    + '<span style="font-family:var(--mono);font-size:11px;color:var(--ink-3)">' + esc(c.meta) + '</span></div>'
    + '<div class="quote">' + hl(c.text, c.ev) + '</div></article></div></div>';
}

function wireCites(){
  var body = document.getElementById('conv-body');
  body.querySelectorAll('.cite').forEach(function(btn){
    btn.addEventListener('click', function(){
      var n = btn.getAttribute('data-cite');
      var on = btn.getAttribute('aria-expanded') !== 'true';
      body.querySelectorAll('.cite').forEach(function(x){ x.setAttribute('aria-expanded','false'); });
      body.querySelectorAll('.seg').forEach(function(x){ x.classList.remove('lit'); });
      body.querySelectorAll('.slot').forEach(function(x){ x.classList.remove('open'); });
      if (!on) return;
      btn.setAttribute('aria-expanded','true');
      body.querySelectorAll('.seg[data-seg="' + n + '"]').forEach(function(x){ x.classList.add('lit'); });
      var slot = body.querySelector('.slot[data-slot="' + n + '"]');
      if (slot) slot.classList.add('open');
    });
  });
}

function readHash(){
  var raw = location.hash.replace(/^#/, '');
  if (!raw) return;
  raw.split('/').forEach(function(seg){
    if (!seg) return;
    if (SCREENS.indexOf(seg) >= 0) { S.screen = seg; return; }
    if (TYPES.indexOf(seg) >= 0)   { S.type = seg; if (S.screen !== 'thread') S.screen = 'thread'; return; }
    if (SCALES[seg] !== undefined) { S.scale = SCALES[seg]; return; }
    if (THEMES.indexOf(seg) >= 0)  { S.theme = seg; return; }
    if (VPS.indexOf(seg) >= 0)     { S.vp = seg; return; }
    if (seg === 'bare')            { S.bare = true; return; }
    var m = /^b(\d+)$/.exec(seg);
    if (m) { S.bot = parseInt(m[1], 10); return; }
  });
}
function writeHash(){
  var p = [S.screen];
  if (S.screen === 'thread') p.push(S.type);
  if (S.screen === 'bot' || S.screen === 'start') p.push('b' + S.bot);
  if (S.scale !== 14) { for (var k in SCALES) if (SCALES[k] === S.scale) p.push(k); }
  if (S.theme !== 'auto') p.push(S.theme);
  if (S.vp !== 'desktop') p.push(S.vp);
  if (S.bare) p.push('bare');
  var h = '#' + p.join('/');
  if (location.hash !== h) history.replaceState(null, '', h);
  document.getElementById('c-hash').textContent = h;
}

function paint(){
  var root = document.documentElement;
  if (S.theme === 'auto') root.removeAttribute('data-theme');
  else root.setAttribute('data-theme', S.theme);
  root.setAttribute('data-motion', S.motion);
  root.setAttribute('data-vp', S.vp);
  root.setAttribute('data-bare', S.bare ? 'on' : 'off');
  try {
    localStorage.setItem('bc-b-theme', S.theme);
    localStorage.setItem('bc-b-motion', S.motion);
  } catch(e){}

  renderHome(); renderBot(); renderStart(); renderThread();
  renderMypage(); renderGuide(); renderStates();

  var rail = railHtml();
  ['home','bot','start','thread','mypage','guide','states'].forEach(function(s){
    var el = document.getElementById('rail-' + s);
    if (el) el.innerHTML = rail;
  });

  SCREENS.forEach(function(s){
    var el = document.getElementById('s-' + s);
    if (s === S.screen) el.setAttribute('data-on','');
    else el.removeAttribute('data-on');
  });

  paintControls();
  writeHash();
}
/* 화면 전환에 View Transitions 를 쓴다. 창구 마크가 대화 헤더로 이어진다.
   지원하지 않는 브라우저에서는 그냥 즉시 바뀐다. */
function apply(){
  if (S.motion === 'off' || !document.startViewTransition) { paint(); return; }
  document.startViewTransition(function(){ paint(); });
}

function paintControls(){
  function fill(id, items, cur, onPick){
    var box = document.getElementById(id);
    box.innerHTML = '';
    items.forEach(function(it){
      var b = document.createElement('button');
      b.textContent = it.l;
      b.setAttribute('aria-pressed', it.v === cur ? 'true' : 'false');
      b.addEventListener('click', function(){ onPick(it.v); apply(); });
      box.appendChild(b);
    });
  }
  fill('c-screen', SCREENS.map(function(s){ return { v:s, l:LBL[s] }; }), S.screen, function(v){ S.screen = v; });
  fill('c-type', TYPES.map(function(t){ return { v:t, l:ALBL[t] }; }), S.type, function(v){ S.type = v; S.screen = 'thread'; });
  fill('c-scale', Object.keys(SCALES).map(function(k){ return { v:SCALES[k], l:SCALES[k] + '곳' }; }), S.scale, function(v){ S.scale = v; });
  fill('c-vp', [{v:'desktop',l:'넓게'},{v:'mobile',l:'좁게'}], S.vp, function(v){ S.vp = v; });
  fill('c-theme', [{v:'light',l:'라이트'},{v:'dark',l:'다크'},{v:'auto',l:'자동'}], S.theme, function(v){ S.theme = v; });
  fill('c-motion', [{v:'on',l:'켬'},{v:'off',l:'끔'}], S.motion, function(v){ S.motion = v; });
}

document.addEventListener('click', function(e){
  var go = e.target.closest ? e.target.closest('[data-go]') : null;
  if (go) {
    go.getAttribute('data-go').split('/').forEach(function(p){
      if (SCREENS.indexOf(p) >= 0) S.screen = p;
      else if (TYPES.indexOf(p) >= 0) { S.type = p; S.screen = 'thread'; }
    });
    apply();
    return;
  }
  var bt = e.target.closest ? e.target.closest('[data-bot]') : null;
  if (bt) { S.bot = parseInt(bt.getAttribute('data-bot'), 10); S.screen = 'bot'; apply(); }
});
window.addEventListener('hashchange', function(){ readHash(); apply(); });

readHash();
paint();
})();
</script>
</body>
</html>
