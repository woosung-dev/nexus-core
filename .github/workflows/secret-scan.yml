name: Secret Scan

# 측정 도구를 git 에 남기면서 `/exports` ignore 라는 우연한 방어막이 사라졌다.
# GitHub push protection 은 Gemini 키와 Neon 접속 문자열을 못 잡는다(실증됨) —
# 그 구멍을 여기서 막는다. 자세한 것은 `scripts/scan_secrets.py` docstring.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 추적 파일에서 크리덴셜 검사
        run: python3 scripts/scan_secrets.py
