# 맥락 보완 UX 프로토타입 전용 포트 오버라이드.
# `clarify-prototype=1`인 새 대화는 로그인 없이 접근할 수 있으며, 모든 포트는 로컬 호스트에만 연다.
# RAG Store도 운영 환경과 분리해 테스트 문서가 운영 지식 베이스에 섞이지 않게 한다.
# 실행: docker compose -p nexus-clarification -f docker-compose.yml -f docker-compose.prototype.yml up --build
services:
  api:
    container_name: nexus_clarification_api
    ports: !override
      - "127.0.0.1:8180:8080"
    environment:
      CORS_ORIGINS: "http://localhost:3201,http://127.0.0.1:3201"
      CLARIFICATION_PROTOTYPE_ENABLED: "true"
      CLARIFICATION_PROTOTYPE_DEV_AUTH_BYPASS: "true"
      FILE_SEARCH_STORE_NAME: "nexus-clarification-prototype"
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8080 --reload"

  client:
    container_name: nexus_clarification_client
    ports: !override
      - "127.0.0.1:3201:3000"
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:8180/api/v1"
      NEXT_PUBLIC_CLARIFICATION_PROTOTYPE_BYPASS_AUTH: "true"

  admin:
    container_name: nexus_clarification_admin
    ports: !override
      - "127.0.0.1:3101:3001"
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:8180"
      INTERNAL_API_URL: "http://api:8080"

  db:
    container_name: nexus_clarification_db
    ports: !override
      - "127.0.0.1:55432:5432"
